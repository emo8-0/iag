<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحة الموقع</title><style>
body {
    font-family: Arial;
    background: #f2f2f2;
    padding: 15px;
    text-align: center;
}
.card {
    background: white;
    padding: 18px;
    margin: 15px auto;
    border-radius: 10px;
    max-width: 500px;
}
button {
    padding: 12px;
    margin: 5px;
    border: 0;
    border-radius: 6px;
    background: #1877d2;
    color: white;
}
iframe {
    width: 100%;
    height: 350px;
    border: 0;
}
</style></head><body><div class="card">
<h3>الموقع</h3>
<div id="siteArea"></div>
</div><div class="card">
<h3>معلومات الجهاز</h3>
<p id="deviceInfo"></p>
</div><div class="card">
<h3>الموقع الجغرافي</h3>
<button id="getLocation">مشاركة موقعي</button>
<p id="locationResult"></p>
</div><div class="card">
<h3>التسجيل الصوتي</h3>
<p>سيُستخدم الميكروفون بعد موافقتك. استمع إلى التسجيل قبل مشاركته.</p><button id="startRecording">بدء التسجيل</button>

<p id="status">بانتظار التسجيل</p><audio id="audioPlayer" controls></audio>

<br><button id="sendRecording" disabled>
مشاركة التسجيل
</button>
</div><script>
var params = new URLSearchParams(window.location.search);
var site = params.get("site");
var options = params.get("options") || "";

if (site) {
    var frame = document.createElement("iframe");
    frame.src = site;
    document.getElementById("siteArea").appendChild(frame);

    var openLink = document.createElement("a");
    openLink.href = site;
    openLink.target = "_blank";
    openLink.textContent = "فتح الموقع";
    document.getElementById("siteArea").appendChild(openLink);
}

if (options.indexOf("device") !== -1) {
    document.getElementById("deviceInfo").textContent =
        navigator.userAgent;
}

var recorder;
var audioStream;
var audioChunks = [];
var audioBlob;

document.getElementById("getLocation").onclick = function() {
    if (!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(function(position) {
        document.getElementById("locationResult").textContent =
            "خط العرض: " + position.coords.latitude +
            "، خط الطول: " + position.coords.longitude;
    }, function() {
        document.getElementById("locationResult").textContent =
            "تعذر الحصول على الموقع.";
    });
};

document.getElementById("startRecording").onclick =
async function() {
    try {
        audioStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        audioChunks = [];

        recorder = new MediaRecorder(audioStream);

        recorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        recorder.onstop = function() {
            audioBlob = new Blob(audioChunks, {
                type: recorder.mimeType
            });

            document.getElementById("audioPlayer").src =
                URL.createObjectURL(audioBlob);

            document.getElementById("sendRecording").disabled = false;

            audioStream.getTracks().forEach(function(track) {
                track.stop();
            });

            document.getElementById("status").textContent =
                "انتهى التسجيل. استمع إليه قبل المشاركة.";
        };

        recorder.start();

        document.getElementById("status").textContent =
            "جاري التسجيل لمدة 5 ثوانٍ";

        setTimeout(function() {
            if (recorder.state === "recording") {
                recorder.stop();
            }
        }, 5000);

    } catch(error) {
        document.getElementById("status").textContent =
            "لم تتم الموافقة على الميكروفون.";
    }
};

document.getElementById("sendRecording").onclick =
async function() {
    if (!audioBlob) return;

    var file = new File(
        [audioBlob],
        "recording.webm",
        {type: audioBlob.type}
    );

    if (navigator.share && navigator.canShare &&
        navigator.canShare({files: [file]})) {

        await navigator.share({
            files: [file],
            title: "التسجيل الصوتي"
        });

    } else {
        var link = document.createElement("a");
        link.href = URL.createObjectURL(audioBlob);
        link.download = "recording.webm";
        link.click();
    }
};
</script></body>
</html>
