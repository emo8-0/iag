<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Device Test</title><style>
body {
    background: #101820;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}

button {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    background: #00a884;
    color: white;
    border: 0;
    border-radius: 7px;
}

video {
    width: 100%;
    background: black;
}

#result {
    background: #202d38;
    padding: 15px;
    margin-top: 15px;
    overflow-wrap: anywhere;
}
</style></head><body><h2>اختبار أذونات الجهاز</h2><p id="selected"></p><button onclick="startCamera('user')">اختبار الكاميرا الأمامية</button>
<button onclick="startCamera('environment')">اختبار الكاميرا الخلفية</button>
<button onclick="testMicrophone()">اختبار المايك</button>
<button onclick="getLocation()">عرض الموقع</button>
<button onclick="deviceInfo()">معلومات الجهاز</button>
<button onclick="openWebsite()">فتح الموقع</button>
<button onclick="stopCamera()">إيقاف الكاميرا</button>

<video id="preview" autoplay playsinline muted></video>

<div id="result">النتائج تظهر هنا</div><script>

var params = new URLSearchParams(window.location.search);
var site = params.get("site");
var options = params.get("options") || "";
var stream = null;

document.getElementById("selected").innerText =
    "الخيارات المحددة: " + options;

function showResult(message) {
    document.getElementById("result").innerText = message;
}

async function startCamera(mode) {

    try {

        stopCamera();

        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: mode },
            audio: false
        });

        document.getElementById("preview").srcObject = stream;

        showResult("تم منح إذن الكاميرا. المعاينة محلية فقط.");

    } catch (error) {

        showResult("تعذر تشغيل الكاميرا: " + error.message);

    }
}

async function testMicrophone() {

    try {

        var audio = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audio.getTracks().forEach(function(track) {
            track.stop();
        });

        showResult("تم منح إذن المايك. لم يتم تسجيل الصوت.");

    } catch (error) {

        showResult("تعذر تشغيل المايك: " + error.message);

    }
}

function getLocation() {

    if (!navigator.geolocation) {
        showResult("تحديد الموقع غير مدعوم.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {

            showResult(
                "خط العرض: " + position.coords.latitude +
                "\nخط الطول: " + position.coords.longitude
            );

        },
        function(error) {
            showResult("تعذر تحديد الموقع: " + error.message);
        }
    );
}

function deviceInfo() {

    showResult(
        "المتصفح: " + navigator.userAgent +
        "\nالنظام: " + navigator.platform +
        "\nالشاشة: " + screen.width + "x" + screen.height
    );

}

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(function(track) {
            track.stop();
        });

        stream = null;
        document.getElementById("preview").srcObject = null;
    }
}

function openWebsite() {

    if (!site) {
        showResult("لم يتم تحديد رابط الموقع.");
        return;
    }

    try {

        var url = new URL(site);

        if (url.protocol !== "https:" &&
            url.protocol !== "http:") {
            showResult("رابط غير صالح.");
            return;
        }

        window.location.href = url.href;

    } catch (error) {

        showResult("تعذر فتح الرابط.");

    }
}

</script></body>
</html>
