<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Device Permission Test</title>

<style>
body {
    background: #101820;
    color: white;
    font-family: Arial;
    padding: 20px;
    text-align: center;
}

button, select {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 0;
    border-radius: 7px;
    font-size: 16px;
}

button {
    background: #00a884;
    color: white;
}

video {
    width: 100%;
    margin-top: 15px;
    background: black;
    border-radius: 10px;
}

#result {
    background: #202d38;
    padding: 15px;
    margin-top: 15px;
    border-radius: 8px;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<h2>اختبار أذونات الجهاز</h2>

<p>اختر الإذن الذي تريد اختباره. المتصفح سيطلب موافقتك.</p>

<select id="cameraType">
    <option value="user">الكاميرا الأمامية</option>
    <option value="environment">الكاميرا الخلفية</option>
</select>

<button onclick="startCamera()">تشغيل الكاميرا</button>

<button onclick="testMicrophone()">اختبار المايك</button>

<button onclick="getLocation()">عرض موقعي</button>

<button onclick="deviceInfo()">معلومات الجهاز</button>

<video id="preview" autoplay playsinline muted></video>

<div id="result">النتائج تظهر هنا</div>

<button onclick="stopCamera()">إيقاف الكاميرا</button>

<button onclick="openWebsite()">فتح الموقع المحدد</button>

<script>

var stream = null;

var result = document.getElementById("result");

var params = new URLSearchParams(window.location.search);

var targetSite = params.get("site");

function show(text) {
    result.innerText = text;
}

async function startCamera() {

    try {

        stopCamera();

        var facing = document.getElementById("cameraType").value;

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: facing
            },
            audio: false
        });

        document.getElementById("preview").srcObject = stream;

        show("تم منح إذن الكاميرا. المعاينة محلية.");

    } catch (error) {

        show("تعذر تشغيل الكاميرا: " + error.message);

    }
}

async function testMicrophone() {

    try {

        var audioStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
            });

        audioStream.getTracks().forEach(function(track) {
            track.stop();
        });

        show("تم منح إذن المايك. لم يتم تسجيل الصوت.");

    } catch (error) {

        show("تعذر الوصول إلى المايك: " + error.message);

    }
}

function getLocation() {

    if (!navigator.geolocation) {
        show("المتصفح لا يدعم تحديد الموقع.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {

            var lat = position.coords.latitude;
            var lon = position.coords.longitude;

            show(
                "خط العرض: " + lat +
                "\nخط الطول: " + lon
            );

        },
        function(error) {
            show("تعذر تحديد الموقع: " + error.message);
        }
    );
}

function deviceInfo() {

    show(
        "المتصفح: " + navigator.userAgent +
        "\nالنظام: " + navigator.platform +
        "\nحجم الشاشة: " +
        screen.width + " × " + screen.height
    );

}

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(function(track) {
            track.stop();
        });

        stream = null;

        document.getElementById("preview").srcObject = null;
    }
}

function openWebsite() {

    if (!targetSite) {
        show("لم يتم تحديد موقع.");
        return;
    }

    try {

        var url = new URL(targetSite);

        if (url.protocol !== "https:" &&
            url.protocol !== "http:") {
            show("رابط الموقع غير صالح.");
            return;
        }

        window.location.href = url.href;

    } catch (error) {

        show("الرابط غير صالح.");

    }
}

</script>

</body>
</html>
