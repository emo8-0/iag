<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IAG Permission Page</title>
<style>
body {
    background:#101827;
    color:white;
    font-family:Arial;
    padding:20px;
}
.box {
    max-width:430px;
    margin:40px auto;
    background:#1c293b;
    padding:22px;
    border-radius:14px;
}
.item {
    background:#263750;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
}
button {
    width:100%;
    padding:14px;
    margin-top:14px;
    border:0;
    border-radius:8px;
    background:#2585ed;
    color:white;
    font-size:16px;
}
</style>
</head>
<body>

<div class="box">
<h2>مراجعة الموافقة</h2>
<p>راجع الخيارات قبل الانتقال إلى الموقع. هذه الصفحة لا تجمع بياناتك.</p>
<div id="permissions"></div>
<button onclick="continueSite()">موافقة والمتابعة</button>
<button onclick="reject()">رفض</button>
</div>

<script>
var data;

try {
    var params = new URLSearchParams(location.search);
    var encoded = params.get("u");

    if (!encoded) throw new Error();

    var binary = atob(encoded);
    var bytes = new Uint8Array(binary.length);

    for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    var payload = new TextDecoder("utf-8").decode(bytes);
    data = new URLSearchParams(payload);

    var names = {
        fc: "الكاميرا الأمامية",
        bc: "الكاميرا الخلفية",
        fcv: "فيديو الكاميرا الأمامية",
        bcv: "فيديو الكاميرا الخلفية",
        audio: "الصوت",
        location: "الموقع الجغرافي",
        device: "معلومات الجهاز"
    };

    var selected = (data.get("permissions") || "").split(",");
    var container = document.getElementById("permissions");

    selected.forEach(function(key) {
        if (!names[key]) return;

        var div = document.createElement("div");
        div.className = "item";
        div.textContent = names[key];
        container.appendChild(div);
    });

} catch(e) {
    document.querySelector(".box").textContent =
        "الرابط غير صالح أو البيانات غير مكتملة.";
    data = null;
}

function continueSite() {
    if (!data) return;

    try {
        var site = new URL(data.get("site"));

        if (site.protocol !== "https:" &&
            site.protocol !== "http:") {
            throw new Error();
        }

        location.replace(site.href);

    } catch(e) {
        alert("رابط الموقع غير صالح");
    }
}

function reject() {
    document.querySelector(".box").textContent =
        "تم رفض الموافقة. لم يتم جمع بيانات.";
}
</script>
</body>
</html>
