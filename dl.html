<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastDownload</title>

<style>
body {
    background:#101827;
    color:white;
    font-family:Arial;
    padding:20px;
}
.box {
    max-width:430px;
    margin:50px auto;
    padding:25px;
    background:#1c293b;
    border-radius:14px;
}
.item {
    background:#263750;
    padding:14px;
    margin:12px 0;
    border-radius:8px;
}
p {
    line-height:1.8;
    color:#c4d0df;
}
button {
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    background:#2585ed;
    color:white;
    font-size:16px;
}
.reject {
    background:#43536a;
}
</style>
</head>

<body>

<div class="box">
<h2>صفحة الموافقة</h2>

<p>
راجع المعلومات التالية قبل المتابعة إلى الموقع.
هذه الصفحة لا تلتقط الصور أو الصوت ولا تجمع بيانات موقعك.
</p>

<div id="details"></div>

<button onclick="continueSite()">موافقة والمتابعة</button>
<button class="reject" onclick="reject()">رفض</button>
</div>

<script>
function decodePayload() {
    const params = new URLSearchParams(location.search);
    const encoded = params.get("u");

    if (!encoded) throw new Error("Missing payload");

    const normalized = encoded.replace(/ /g, "+");
    const decoded = decodeURIComponent(
        Array.from(atob(normalized))
            .map(c => "%" + c.charCodeAt(0).toString(16).padStart(2,"0"))
            .join("")
    );

    return new URLSearchParams(decoded);
}

let data;

try {
    data = decodePayload();
} catch {
    document.querySelector(".box").innerHTML =
        "<h2>الرابط غير صالح</h2><p>تعذر قراءة إعدادات الرابط.</p>";
}

const names = {
    camera: "الكاميرا",
    microphone: "الميكروفون",
    location: "الموقع الجغرافي",
    device: "معلومات الجهاز"
};

if (data) {
    const container = document.getElementById("details");
    const selected = (data.get("permissions") || "")
        .split(",")
        .filter(Boolean);

    selected.forEach(value => {
        if (!names[value]) return;

        const item = document.createElement("div");
        item.className = "item";
        item.textContent = names[value];
        container.appendChild(item);
    });
}

function continueSite() {
    if (!data) return;

    let destination;

    try {
        destination = new URL(data.get("site"));

        if (!["https:", "http:"].includes(destination.protocol)) {
            throw new Error();
        }
    } catch {
        alert("رابط الموقع غير صالح");
        return;
    }

    location.replace(destination.href);
}

function reject() {
    document.querySelector(".box").innerHTML =
        "<h2>تم رفض الموافقة</h2><p>لم يتم جمع أي بيانات.</p>";
}
</script>

</body>
</html>
