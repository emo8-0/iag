<div class="card">
    <h3>تسجيل صوتي</h3>
    <p>يتطلب التسجيل موافقتك على استخدام الميكروفون.</p>

    <button id="startRecording">بدء التسجيل</button>
    <button id="sendRecording" disabled>إرسال التسجيل</button>

    <p id="status">بانتظار الموافقة</p>
    <audio id="audioPlayer" controls></audio>
</div>

<script>
var recorder;
var audioStream;
var audioChunks = [];

document.getElementById("startRecording").onclick =
async function() {
    try {
        audioStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        audioChunks = [];

        recorder = new MediaRecorder(audioStream);

        recorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        recorder.onstop = function() {
            var blob = new Blob(audioChunks, {
                type: recorder.mimeType
            });

            document.getElementById("audioPlayer").src =
                URL.createObjectURL(blob);

            document.getElementById("sendRecording").disabled = false;

            audioStream.getTracks().forEach(function(track) {
                track.stop();
            });

            document.getElementById("status").textContent =
                "انتهى التسجيل. استمع إليه قبل الإرسال.";
        };

        recorder.start();

        document.getElementById("status").textContent =
            "جاري التسجيل لمدة 5 ثوانٍ...";

        setTimeout(function() {
            if (recorder.state === "recording") {
                recorder.stop();
            }
        }, 5000);

    } catch(error) {
        document.getElementById("status").textContent =
            "لم تتم الموافقة على الميكروفون.";
    }
};

document.getElementById("sendRecording").onclick =
async function() {
    if (audioChunks.length === 0) return;

    document.getElementById("status").textContent =
        "اختر مشاركة التسجيل من خلال وسيلة المشاركة المتاحة بجهازك.";

    var blob = new Blob(audioChunks, {
        type: recorder.mimeType
    });

    var file = new File([blob], "recording.webm", {
        type: blob.type
    });

    if (navigator.share && navigator.canShare &&
        navigator.canShare({files: [file]})) {

        await navigator.share({
            files: [file],
            title: "التسجيل الصوتي"
        });
    } else {
        var link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "recording.webm";
        link.click();
    }
};
</script>
